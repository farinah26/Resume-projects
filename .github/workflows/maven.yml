name: Maven Build

on:
  push:
    paths:
      - "project1-feedback-analysis/**"
      - ".github/workflows/maven.yml"
  pull_request:
    paths:
      - "project1-feedback-analysis/**"
      - ".github/workflows/maven.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: project1-feedback-analysis

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
          cache-dependency-path: project1-feedback-analysis/pom.xml

      - name: Build and test
        run: mvn --batch-mode clean package

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: feedback-processor-build
          path: project1-feedback-analysis/target/*.jar
          if-no-files-found: error
